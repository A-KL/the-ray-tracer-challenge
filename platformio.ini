; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = mac_os

[env:lilygo-t-hmi]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
build_type = debug ; build in debug mode instead of release mode
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
	time
	default
	esp32_exception_decoder

lib_deps = 
	bodmer/TFT_eSPI@^2.5.34

build_flags = 
  -fexceptions
  -std=gnu++17
  ; -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=5
  ; RAM
	-D BOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	; TFT_eSPI
	-D DISABLE_ALL_LIBRARY_WARNINGS
	-D USER_SETUP_LOADED
	-D LOAD_GLCD
	-D LOAD_FONT2
	-D LOAD_FONT4
	-D LOAD_FONT6
	-D LOAD_FONT7
	-D LOAD_FONT8
	-D LOAD_GFXFF
	-D SMOOTH_FONT
	-D ST7789_DRIVER
	-D TFT_ROTATE=0
	-D TFT_PARALLEL_8_BIT
	-D TFT_INVERSION_OFF
	-D TFT_RGB_ORDER=TFT_BRG
	-D TFT_WIDTH=240
  -D TFT_HEIGHT=320
	-D TFT_D0=48
	-D TFT_D1=47
	-D TFT_D2=39
	-D TFT_D3=40
	-D TFT_D4=41
	-D TFT_D5=42
	-D TFT_D6=45
	-D TFT_D7=46	
	-D TFT_WR=8
	-D TFT_RD=-1
	-D TFT_CS=6
	-D TFT_DC=7
	-D TFT_RST=-1
	-D TFT_BLK_PIN=38
	; Power
	-D PWR_EN_PIN=10
	-D PWR_ON_PIN=14
	-D BAT_ADC_PIN=5
	-D BUTTON1_PIN=0
	-D BUTTON2_PIN=21

[env:m5stack-fire]
platform = espressif32
board = m5stack-fire
framework = arduino
monitor_speed = 115200
extra_scripts = pre:extra_script.py
build_flags = 
  -fexceptions
  -std=gnu++17
  -DLGFX_AUTODETECT
lib_deps = 
  m5stack/M5GFX@^0.1.16
  lovyan03/LovyanGFX@^1.2.7

[common]
platform = native@^1.2.1
build_type = debug
build_flags =
  -g
  -lSDL2
  -D_DEBUG
  -I ./test
  -fexceptions
lib_deps = 
	lovyan03/LovyanGFX@^1.2.7
build_src_filter =
	-<src-sdl/*.*>

[env:mac_os]
platform = native@^1.2.1
; extra_scripts = pre:extra_script.py
build_flags =
  ${common.build_flags}
  -std=gnu++17
  -DLGFX_AUTODETECT
  -I /opt/homebrew/Cellar/sdl2/2.32.10/include
  -L /opt/homebrew/Cellar/sdl2/2.32.10/lib
lib_deps = 
	${common.lib_deps}
	throwtheswitch/Unity@^2.6.1
  
[env:win]
platform = native@^1.2.1
; extra_scripts = pre:extra_script.py
; debug_test = *
build_flags =
  ${common.build_flags}
	-std=gnu++17
  -DLGFX_AUTODETECT
  -I /mingw64/include
  -L /mingw64/lib
lib_deps = 
	${common.lib_deps}
